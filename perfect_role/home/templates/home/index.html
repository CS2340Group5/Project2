{% extends 'base.html' %}
{% block content %}
<header class="masthead bg-index text-white text-center py-5">
  <div class="container d-flex align-items-center flex-column py-5">
    <h1>Perfect Role</h1>
    <p class="lead">Where job seekers and recruiters meet.</p>
  </div>
</header>
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto text-center mb-3">
        <h4>Find your next opportunity, or your next hire.</h4>
        <p>Build a profile, search postings, and connect with recruiters.</p>
        {% if not user.is_authenticated %}
        <a class="btn bg-dark text-white" href="{% url 'accounts.signup' %}">Get Started</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock content %}
