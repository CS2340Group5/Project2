<div id="{{ modal_prefix }}{{ target_id }}" class="modal fade" tabindex="-1" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="{{ action_url }}" class="pr-form">
        {% csrf_token %}
        <div class="modal-body p-4">
          <h4><i class="fa-solid fa-flag me-1"></i> Report {{ target_kind }}: {{ target_label }}</h4>
          <p class="text-muted small mb-3">Reports are confidential. An administrator will investigate before any action is taken.</p>
          <label>Reason</label>
          <select class="form-select" name="reason" required>
            <option value="" selected disabled>Choose a reason...</option>
            <option value="INAPPROPRIATE">Inappropriate content</option>
            <option value="MISLEADING">Misleading or fraudulent</option>
            <option value="ABUSIVE">Abusive or harassing behavior</option>
            <option value="SPAM">Spam</option>
            <option value="OTHER">Other</option>
          </select>
          <label class="mt-3">Details</label>
          <textarea class="form-control" name="details" rows="4" maxlength="1000" placeholder="Tell us what is inappropriate, misleading, or abusive..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn-pr"><i class="fa-solid fa-flag me-1"></i> Submit Report</button>
          <button type="button" class="btn-pr-ink" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
