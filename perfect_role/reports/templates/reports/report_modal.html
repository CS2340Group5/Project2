<div id="{{ modal_prefix }}{{ target_id }}" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="{{ modal_prefix }}{{ target_id }}-title" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="{{ action_url }}" class="pr-form">
        {% csrf_token %}
        <div class="modal-body p-4">
          <div class="pr-modal-tag mb-1"><i class="fa-solid fa-flag me-1"></i> Report {{ target_kind }}</div>
          <h4 id="{{ modal_prefix }}{{ target_id }}-title">{{ target_label }}</h4>
          <p class="text-muted small mb-3">Reports are confidential. An administrator will investigate before any action is taken.</p>
          <label for="{{ modal_prefix }}{{ target_id }}-reason">Reason</label>
          <select class="form-select" name="reason" id="{{ modal_prefix }}{{ target_id }}-reason" required>
            <option value="" selected disabled>Choose a reason...</option>
            {% for value, label in report_reasons %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
          <label for="{{ modal_prefix }}{{ target_id }}-details" class="mt-3">Details</label>
          <textarea class="form-control" name="details" id="{{ modal_prefix }}{{ target_id }}-details" rows="4" maxlength="1000"
            placeholder="Tell us what is inappropriate, misleading, or abusive..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn-pr"><i class="fa-solid fa-flag me-1"></i> Submit Report</button>
          <button type="button" class="btn-pr-ink" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
