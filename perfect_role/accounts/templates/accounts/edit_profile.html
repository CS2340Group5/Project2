{% extends 'base.html' %}
{% block content %}
<div class="p-3 mt-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow p-3 mb-4 rounded">
          <div class="card-body">
            <h2>Edit Profile</h2>
            <hr />
            <form method="POST">
              {% csrf_token %}
              {{ template_data.form.as_p }}
              <button type="submit" class="btn bg-dark text-white">Save</button>
            </form>
          </div>
        </div>
        <div class="card shadow p-3 mb-4 rounded">
          <div class="card-body">
            <h4>Links</h4>
            <hr />
            {% for link in template_data.links %}
            <p>
              <a href="{{ link.url }}" target="_blank">{{ link.title }}</a>
              <a class="btn btn-sm btn-outline-danger ms-2" href="{% url 'accounts.delete_link' link.id %}">Remove</a>
            </p>
            {% endfor %}
            <form method="POST" action="{% url 'accounts.add_link' %}">
              {% csrf_token %}
              {{ template_data.link_form.as_p }}
              <button type="submit" class="btn bg-dark text-white">Add Link</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
